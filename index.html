<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Store</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Your Store</h1>
  <button id="cart-toggle">Cart (<span id="count">0</span>)</button>
</header>
<main>
  <section class="hero">
    <h2>Simple goods, well made</h2>
    <p>Placeholder copy. Replace with your brand story.</p>
  </section>
  <section id="products" class="grid"></section>
</main>
<aside id="cart" hidden>
  <h3>Your cart</h3>
  <ul id="items"></ul>
  <p>Total: <strong id="total">$0.00</strong></p>
  <button id="checkout">Checkout</button>
  <p id="note"></p>
</aside>
<footer>&copy; 2026 Your Store</footer>
<script src="app.js"></script>
</body>
</html>
